<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Style Playlist</title>
    <style>
      :root {
        --bg: #121212;
        --bg-2: #181818;
        --panel: #1f1f1f;
        --panel-soft: #2a2a2a;
        --muted: #b3b3b3;
        --text: #ffffff;
        --accent: #1db954;
        --accent-2: #169c46;
        --border: rgba(255, 255, 255, 0.07);
        --soft-glow: rgba(29, 185, 84, 0.3);
        --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(29, 185, 84, 0.12), transparent 28%),
          linear-gradient(180deg, #1b1b1b 0%, var(--bg) 25%, var(--bg) 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        scroll-behavior: smooth;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        transition: background 0.3s ease;
      }

      .app-shell {
        width: min(1400px, 95vw);
        min-height: 90vh;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }

      .sidebar {
        background: rgba(0, 0, 0, 0.38);
        padding: 28px 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset -1px 0 0 rgba(255,255,255,0.02);
        overflow: hidden;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 28px;
        letter-spacing: -0.06em;
        animation: popIn 0.5s ease both;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        background: linear-gradient(135deg, #1db954, #14a44d);
        border-radius: 50%;
        position: relative;
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        inset: 7px 8px 7px 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
      }

      .nav {
        display: grid;
        gap: 10px;
        margin-bottom: 32px;
        animation: popIn 0.6s ease both;
      }

      .nav-item {
        background: transparent;
        border: none;
        color: var(--muted);
        text-align: left;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 320ms var(--ease-soft), background 260ms var(--ease-soft), color 260ms var(--ease-soft), box-shadow 260ms var(--ease-soft);
        will-change: transform, background, box-shadow;
      }

      .nav-item:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        transform: translateX(4px) scale(1.01);
      }

      .nav-item.active {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .playlist-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 26px 4px 14px;
        animation: popIn 0.7s ease both;
      }

      .playlist-header h3 {
        margin: 0;
        font-size: 0.96rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .shuffle-btn {
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.04);
        color: white;
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: transform 360ms var(--ease-bounce), background 300ms var(--ease-smooth), border-color 300ms var(--ease-smooth), box-shadow 300ms var(--ease-smooth);
        will-change: transform, box-shadow;
      }

      .shuffle-btn:hover {
        border-color: rgba(29, 185, 84, 0.7);
        background: rgba(29, 185, 84, 0.14);
        transform: translateY(-1px) scale(1.02);
        box-shadow: 0 8px 20px rgba(29, 185, 84, 0.12);
      }

      .playlist {
        list-style: none;
        margin: 0;
        padding: 10px 6px 0;
        display: grid;
        gap: 8px;
        border-top: 1px solid rgba(255,255,255,0.06);
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }

      .song-pill {
        width: 100%;
        max-width: 100%;
        background: rgba(255,255,255,0.01);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.03);
        border-radius: 12px;
        padding: 12px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        text-align: left;
        transition: transform 320ms var(--ease-soft), background 260ms var(--ease-smooth), border-color 260ms var(--ease-smooth), box-shadow 260ms var(--ease-smooth), opacity 260ms var(--ease-smooth);
        overflow: hidden;
        min-width: 0;
        animation: popIn 0.5s ease both;
        will-change: transform, box-shadow;
      }

      .song-pill:hover {
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.08);
        transform: translateX(2px) scale(1.01);
      }

      .song-pill:active {
        transform: scale(0.985);
      }

      .song-pill.active {
        background: rgba(29, 185, 84, 0.12);
        border-color: rgba(29, 185, 84, 0.3);
        box-shadow: 0 0 0 1px rgba(29, 185, 84, 0.08), inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .song-meta {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .song-number {
        opacity: 0.7;
        font-size: 0.8rem;
        min-width: 22px;
        flex-shrink: 0;
      }

      .song-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.96rem;
        font-weight: 600;
      }

      .song-duration {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .content {
        background: linear-gradient(180deg, rgba(26, 26, 26, 0.9), rgba(18,18,18,0.96));
        padding: 24px 28px 0;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-bottom: 26px;
      }

      .topbar button {
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: white;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 600;
      }

      .hero {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 28px;
        align-items: end;
        padding-bottom: 30px;
      }

      .cover-wrap {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(0,0,0,0.45);
        background: #2f2f2f;
        position: relative;
        transition: transform 420ms var(--ease-smooth), box-shadow 420ms var(--ease-smooth), filter 420ms var(--ease-smooth);
        animation: popIn 0.7s ease both;
        will-change: transform, box-shadow, filter;
      }

      .cover-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.35));
        pointer-events: none;
      }

      .cover-wrap:hover {
        transform: translateY(-6px) scale(1.015);
        box-shadow: 0 24px 80px rgba(29, 185, 84, 0.2);
        filter: saturate(1.08) brightness(1.04);
      }

      .cover-wrap img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 520ms var(--ease-smooth), filter 520ms var(--ease-smooth);
      }

      .cover-wrap:hover img {
        transform: scale(1.05);
      }

      .eyebrow {
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.73rem;
        margin: 0 0 8px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 4rem);
        letter-spacing: -0.06em;
      }

      .meta {
        color: var(--muted);
        margin: 12px 0 22px;
        font-size: 1rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
      }

      .control-btn {
        border: none;
        cursor: pointer;
        color: white;
        background: rgba(255,255,255,0.06);
        border-radius: 50%;
        width: 46px;
        height: 46px;
        font-size: 1.2rem;
        transition: transform 340ms var(--ease-bounce), background 300ms var(--ease-smooth), box-shadow 300ms var(--ease-smooth), filter 300ms var(--ease-smooth);
        animation: popIn 0.5s ease both;
        will-change: transform, box-shadow;
      }

      .control-btn:hover {
        background: rgba(255,255,255,0.12);
        transform: translateY(-2px) scale(1.04);
      }

      .control-btn:active {
        transform: scale(0.96);
      }

      .control-btn.primary {
        background: var(--accent);
        width: 62px;
        height: 62px;
        font-size: 1.5rem;
        box-shadow: 0 0 28px rgba(29,185,84,0.45);
        animation: pulse 2.8s infinite ease-in-out;
      }

      .control-btn.primary:hover {
        background: #1ed760;
        transform: translateY(-2px) scale(1.05);
      }

      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 0 18px rgba(29,185,84,0.28);
        }
        50% {
          box-shadow: 0 0 30px rgba(29,185,84,0.55);
        }
      }

      @keyframes popIn {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .progress-block {
        max-width: 640px;
      }

      .range-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .time {
        min-width: 42px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        cursor: pointer;
        height: 6px;
        border-radius: 999px;
        filter: drop-shadow(0 0 8px rgba(29,185,84,0.4));
      }

      .track-list {
        background: rgba(255,255,255,0.015);
        border-top: 1px solid var(--border);
        padding-top: 20px;
      }

      .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 16px;
      }

      .song-list {
        list-style: none;
        margin: 0;
        padding: 0 0 28px;
        display: grid;
        gap: 8px;
      }

      .song-row {
        display: grid;
        grid-template-columns: 42px minmax(180px, 1.5fr) minmax(110px, 1fr) 60px;
        align-items: center;
        gap: 12px;
        padding: 12px 12px;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text);
        transition: transform 320ms var(--ease-soft), background 260ms var(--ease-smooth), box-shadow 260ms var(--ease-smooth), opacity 260ms var(--ease-smooth);
        will-change: transform, box-shadow;
      }

      .song-row:hover {
        background: rgba(255,255,255,0.04);
        transform: translateX(4px) scale(1.002);
      }

      .song-row.active {
        background: rgba(29,185,84,0.08);
        box-shadow: inset 0 0 0 1px rgba(29,185,84,0.1);
      }

      .song-row .track-index,
      .song-row .track-duration {
        color: var(--muted);
      }

      .song-row .track-title {
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .song-row:hover .track-title {
        color: var(--text);
      }

      .song-row .track-album {
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .cover-wrap {
          max-width: 340px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Spotify</span>
        </div>

        <nav class="nav">
          <button class="nav-item active" type="button">Home</button>
          <button class="nav-item" type="button">Search</button>
          <button class="nav-item" type="button">Your Library</button>
        </nav>

        <div class="playlist-header">
          <h3>Playlist</h3>
          <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
        </div>

        <ul class="playlist" id="playlist"></ul>
      </aside>

      <main class="content">
        <header class="topbar">
          <button type="button">Browse</button>
        </header>

        <section class="hero">
          <div class="cover-wrap">
            <img id="coverArt" src="images/1.jpg" alt="Album cover" />
          </div>

          <div>
            <p class="eyebrow">Playlist</p>
            <h1 id="songTitle">Abhi Na Jao Chodd Ke</h1>
            <p class="meta" id="songMeta">Track 1 • Best of Moments</p>

            <div class="controls">
              <button class="control-btn" id="prevBtn" type="button" aria-label="Previous">⏮</button>
              <button class="control-btn primary" id="playBtn" type="button" aria-label="Play">▶</button>
              <button class="control-btn" id="nextBtn" type="button" aria-label="Next">⏭</button>
            </div>

            <div class="progress-block">
              <div class="range-wrap">
                <span class="time" id="currentTime">0:00</span>
                <input id="progress" type="range" min="0" max="100" value="0" />
                <span class="time" id="totalTime">0:00</span>
              </div>
            </div>
          </div>
        </section>

        <section class="track-list">
          <div class="list-header">
            <span>All Songs</span>
            <span id="trackCount">0 tracks</span>
          </div>
          <ul class="song-list" id="songList"></ul>
        </section>
      </main>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
      const songs = [
        { title: 'Abhi Na Jao Chodd Ke', file: 'Abhi Na Jao Chodd Ke.m4a', cover: 'images/1.jpg', duration: null },
        { title: 'Bade Acche Lagte Hai', file: 'Bade Acche Lagte Hai.m4a', cover: 'images/2.jpg', duration: null },
        { title: 'Can’t Help Falling in Love With You', file: 'Can’t Help Falling in Love With You.m4a', cover: 'images/3.jpg', duration: null },
        { title: 'Hothon Se Chhu Lo Tum', file: 'Hothon Se Chhu Lo Tum.m4a', cover: 'images/4.jpg', duration: null },
        { title: 'Just the Two of Us', file: 'Just the Two of Us.m4a', cover: 'images/5.jpg', duration: null },
        { title: 'Pal Pal Dil Ke Pass', file: 'Pal Pal Dil Ke Pass.m4a', cover: 'images/8.jpg', duration: null },
        { title: 'Put Your Head on My Shoulder', file: 'Put Your Head on My Shoulder.m4a', cover: 'images/7.jpg', duration: null },
        { title: 'Sunflower', file: 'Sunflower.m4a', cover: 'images/6.jpg', duration: null },
        { title: 'Until I found Her', file: 'Until I found Her.m4a', cover: 'images/9.jpg', duration: null }
      ];

      const audio = document.getElementById('audioPlayer');
      const playlist = document.getElementById('playlist');
      const songList = document.getElementById('songList');
      const coverArt = document.getElementById('coverArt');
      const songTitle = document.getElementById('songTitle');
      const songMeta = document.getElementById('songMeta');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const progress = document.getElementById('progress');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');
      const trackCount = document.getElementById('trackCount');

      let currentIndex = 0;
      let isPlaying = false;

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${String(secs).padStart(2, '0')}`;
      }

      function setAudioSource(index) {
        const song = songs[index];
        audio.src = 'songs/' + encodeURIComponent(song.file);
      }

      function loadSongDurations() {
        songs.forEach((song, index) => {
          const probe = new Audio();
          probe.preload = 'metadata';
          probe.src = 'songs/' + encodeURIComponent(song.file);
          probe.addEventListener('loadedmetadata', () => {
            songs[index].duration = Number.isFinite(probe.duration) ? probe.duration : null;
            renderPlaylist();
            renderSongList();
          }, { once: true });
        });
      }

      function renderPlaylist() {
        playlist.innerHTML = '';
        songs.forEach((song, index) => {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'song-pill' + (index === currentIndex ? ' active' : '');
          const durationText = Number.isFinite(song.duration) ? formatTime(song.duration) : '…';
          button.innerHTML = `
            <span class="song-number">${index + 1}</span>
            <span class="song-meta">
              <span class="song-title">${song.title}</span>
            </span>
            <span class="song-duration">${index === currentIndex ? 'Now' : durationText}</span>
          `;
          button.addEventListener('click', () => selectSong(index, true));
          li.appendChild(button);
          playlist.appendChild(li);
        });
      }

      function renderSongList() {
        songList.innerHTML = '';
        songs.forEach((song, index) => {
          const row = document.createElement('li');
          row.className = 'song-row' + (index === currentIndex ? ' active' : '');
          const durationText = Number.isFinite(song.duration) ? formatTime(song.duration) : '…';
          row.innerHTML = `
            <span class="track-index">${index + 1}</span>
            <span class="track-title">${song.title}</span>
            <span class="track-album">Favorites</span>
            <span class="track-duration">${durationText}</span>
          `;
          row.addEventListener('click', () => selectSong(index, true));
          songList.appendChild(row);
        });
        trackCount.textContent = `${songs.length} tracks`;
      }

      function updatePlayButton() {
        playBtn.textContent = isPlaying ? '❚❚' : '▶';
        playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      }

      function updateInfo() {
        const song = songs[currentIndex];
        coverArt.src = song.cover;
        coverArt.alt = `${song.title} cover`;
        songTitle.textContent = song.title;
        songMeta.textContent = `Track ${currentIndex + 1} • Best of Moments`;
        renderPlaylist();
        renderSongList();
      }

      function selectSong(index, autoplay = true) {
        currentIndex = (index + songs.length) % songs.length;
        setAudioSource(currentIndex);
        updateInfo();
        progress.value = 0;
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';

        if (autoplay) {
          audio.play();
        } else {
          audio.pause();
        }
      }

      function togglePlay() {
        if (!audio.src) {
          selectSong(currentIndex, true);
          return;
        }

        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      }

      function playNext() {
        selectSong(currentIndex + 1, true);
      }

      function playPrevious() {
        selectSong(currentIndex - 1, true);
      }

      function shuffleSongs() {
        if (songs.length < 2) return;

        let randomIndex = currentIndex;
        while (randomIndex === currentIndex) {
          randomIndex = Math.floor(Math.random() * songs.length);
        }

        selectSong(randomIndex, true);
      }

      audio.volume = 0.85;

      audio.addEventListener('loadedmetadata', () => {
        const currentSong = songs[currentIndex];
        if (currentSong) {
          currentSong.duration = audio.duration;
        }
        totalTimeEl.textContent = formatTime(audio.duration);
        renderPlaylist();
        renderSongList();
      });

      audio.addEventListener('timeupdate', () => {
        const value = (audio.currentTime / audio.duration) * 100 || 0;
        progress.value = value;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('canplay', () => {
        totalTimeEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('play', () => {
        isPlaying = true;
        updatePlayButton();
      });

      audio.addEventListener('pause', () => {
        isPlaying = false;
        updatePlayButton();
      });

      audio.addEventListener('ended', () => {
        playNext();
      });

      progress.addEventListener('input', (event) => {
        if (!audio.duration) return;
        const newTime = (Number(event.target.value) / 100) * audio.duration;
        audio.currentTime = newTime;
        currentTimeEl.textContent = formatTime(newTime);
      });

      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', playPrevious);
      nextBtn.addEventListener('click', playNext);
      shuffleBtn.addEventListener('click', shuffleSongs);

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          event.preventDefault();
          togglePlay();
        }
        if (event.key === 'ArrowRight') {
          playNext();
        }
        if (event.key === 'ArrowLeft') {
          playPrevious();
        }
      });

      setAudioSource(currentIndex);
      loadSongDurations();
      updateInfo();
      updatePlayButton();
    </script>
  </body>
</html>
